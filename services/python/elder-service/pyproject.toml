[build-system]
requires = []
build-backend = "minimal_backend"
backend-path = ["build_backend"]

[project]
name = "elder-service"
version = "0.1.0"
description = "Regional Health Platform elder service skeleton"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "uvicorn>=0.30,<1",
]
