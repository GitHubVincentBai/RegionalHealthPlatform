name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "refactor/**"
      - "docs/**"
      - "chore/**"

jobs:
  verify:
    name: Verify Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: ${{ hashFiles('apps/web/package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        if: ${{ hashFiles('services/python/elder-service/pyproject.toml') != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Go
        if: ${{ hashFiles('services/go/iot-gateway/go.mod') != '' }}
        uses: actions/setup-go@v5
        with:
          go-version-file: services/go/iot-gateway/go.mod

      - name: Run unified verification
        run: make verify

      - name: Generate MasterAgent supervision reports
        run: python3 scripts/master_status_report.py --skip-verify --verify-status 通过 --verify-summary "CI job 已完成 make verify。"

      - name: Upload supervision artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-agent-reports
          path: |
            reports/master-agent/elder_mvp_status.md
            reports/master-agent/elder_mvp_dispatch.md
            reports/master-agent/dispatch
          if-no-files-found: warn
