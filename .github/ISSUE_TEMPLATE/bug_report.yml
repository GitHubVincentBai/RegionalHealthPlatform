name: Bug Report
description: Report a defect, regression, or broken workflow
title: "[Bug] "
labels:
  - type:bug
  - status:triage
body:
  - type: textarea
    id: summary
    attributes:
      label: Problem Summary
      description: What is broken?
      placeholder: Describe the observed problem and affected users or systems.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps To Reproduce
      description: How can the team reproduce this issue?
      placeholder: Provide exact steps, inputs, or triggering conditions.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      placeholder: Describe the correct behavior.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      placeholder: Describe the actual behavior, error message, or impact.
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - critical
        - high
        - medium
        - low
    validations:
      required: true

  - type: dropdown
    id: agents
    attributes:
      label: Recommended Agent
      multiple: true
      options:
        - MasterAgent
        - ArchAgent
        - FrontAgent
        - GoAgent
        - PythonAgent
        - DevOpsAgent
        - TestAgent

  - type: textarea
    id: logs
    attributes:
      label: Logs Or Evidence
      description: Add logs, screenshots, CI links, or supporting evidence.

