name: Feature Request
description: Propose a new feature, enhancement, or business capability
title: "[Feature] "
labels:
  - type:feature
  - status:triage
body:
  - type: textarea
    id: background
    attributes:
      label: Business Background
      description: What problem are we solving and for whom?
      placeholder: Describe the business context, user role, and why this matters.
    validations:
      required: true

  - type: textarea
    id: goals
    attributes:
      label: Goals
      description: What outcome should this feature achieve?
      placeholder: List the expected user or business outcomes.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in scope and out of scope?
      placeholder: Include impacted modules, interfaces, data, and any exclusions.
    validations:
      required: true

  - type: dropdown
    id: agents
    attributes:
      label: Recommended Agent
      multiple: true
      options:
        - MasterAgent
        - ArchAgent
        - FrontAgent
        - GoAgent
        - PythonAgent
        - DevOpsAgent
        - TestAgent

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: What must be true for this issue to be done?
      placeholder: Provide concrete, testable acceptance criteria.
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: Risks And Dependencies
      description: What could block or complicate this work?
      placeholder: Note dependencies, assumptions, and risks.

